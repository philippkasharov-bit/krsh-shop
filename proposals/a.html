<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRSH — A · Night Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* A — Night Edition: the shop as a late-night print magazine */
:root { --ink:#0C0B0A; --bone:#ECE6DC; --dim:#9A948A; --red:#E1341E; --gut:clamp(16px,3vw,40px); }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--ink); color:var(--bone); font:500 14px/1.5 'Inter Tight',sans-serif; }
a { color:inherit; text-decoration:none; }
.mast { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:20px var(--gut); border-bottom:1px solid #2a2724; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
.mast nav { display:flex; gap:28px; } .mast .right { justify-self:end; display:flex; gap:28px; }
.logo { font:italic 400 34px/1 'Instrument Serif',serif; letter-spacing:-.01em; text-transform:none; }
.hero { display:grid; grid-template-columns:repeat(12,1fr); grid-template-rows:auto auto; column-gap:var(--gut); padding:0 var(--gut); position:relative; }
.issue { grid-column:1/4; grid-row:1; align-self:start; position:relative; z-index:3; padding-top:28px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); display:flex; flex-direction:column; gap:6px; }
.issue b { color:var(--bone); font-weight:600; }
/* the alley video as a tall cover plate, revealed through a widening slit */
.plate { grid-column:5/10; grid-row:1; align-self:start; height:calc(100svh - 190px); min-height:420px; margin:28px 0 0; position:relative; overflow:hidden; clip-path:inset(0 46% 0 46%); animation:slit 1.6s cubic-bezier(.7,0,.2,1) .2s forwards; }
.plate video, .plate img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:grayscale(.35) contrast(1.05); }
@keyframes slit { to { clip-path:inset(0 0 0 0); } }
.title { grid-column:1/-1; grid-row:1; align-self:end; margin-bottom:-.12em; position:relative; z-index:2; pointer-events:none;
  font:400 clamp(84px,17vw,280px)/.82 'Instrument Serif',serif; letter-spacing:-.035em; display:flex; justify-content:space-between; mix-blend-mode:difference; color:#fff; padding-bottom:18px; }
.title i { font-style:italic; }
.foot { grid-column:1/-1; display:grid; grid-template-columns:repeat(12,1fr); column-gap:var(--gut); border-top:1px solid #2a2724; padding:16px 0 22px; font-size:13px; }
.foot p { grid-column:1/5; color:var(--dim); max-width:38ch; }
.foot .cta { grid-column:10/-1; justify-self:end; display:flex; align-items:center; gap:14px; text-transform:uppercase; letter-spacing:.08em; font-weight:600; font-size:12px; }
.foot .cta::after { content:''; width:56px; height:1px; background:var(--red); transition:width .4s; }
.foot .cta:hover::after { width:96px; }
.dot { color:var(--red); }
@media (max-width:760px) {
  .mast { grid-template-columns:auto 1fr; } .mast nav { display:none; }
  .hero { grid-template-columns:1fr; min-height:calc(100svh - 75px); }
  .issue { grid-column:1; grid-row:1; flex-direction:row; gap:14px; flex-wrap:wrap; }
  .plate { grid-column:1; grid-row:2; height:62svh; min-height:0; margin-top:16px; }
  .title { grid-column:1; grid-row:2; font-size:clamp(76px,24vw,120px); flex-direction:column; margin-bottom:0; }
  .foot { grid-template-columns:1fr; gap:16px; } .foot p, .foot .cta { grid-column:1; justify-self:start; }
}
@media (prefers-reduced-motion:reduce) { .plate { animation:none; clip-path:none; } }
</style></head>
<body>
<header class="mast">
  <nav><a href="#">Shop</a><a href="#">Lookbook</a><a href="#">Journal</a></nav>
  <a class="logo" href="#">Krsh</a>
  <div class="right"><a href="#">Search</a><a href="#">Bag (0)</a></div>
</header>
<main class="hero">
  <div class="issue"><b>Issue 07 <span class="dot">●</span></b><span>Summer 2026</span><span>Shot after midnight, East Alley</span></div>
  <figure class="plate">
    <img src="../images/hero-bg.webp" alt="">
    <video src="../media/hero-alley-web.mp4" poster="../images/hero-bg.webp" autoplay muted loop playsinline aria-hidden="true"></video>
  </figure>
  <h1 class="title"><span>Street</span><i>culture</i></h1>
  <div class="foot">
    <p>Thirteen pairs, chosen by hand. No hype tax, no restock theatre. Read the issue, then pick your pair.</p>
    <a class="cta" href="#">Read the issue</a>
  </div>
</main>
</body></html>
