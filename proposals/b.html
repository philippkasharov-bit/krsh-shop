<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRSH — B · Spec Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* B — Spec Sheet: the sneaker as an engineered object on a concrete lab table */
:root { --conc:#D8D5CF; --ink:#141414; --mid:#6E6B66; --hot:#FF4F1A; --line:rgba(20,20,20,.18); --gut:clamp(16px,2.5vw,32px); }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--conc); color:var(--ink); font:400 15px/1.5 'Archivo',sans-serif; }
a { color:inherit; text-decoration:none; }
.mono { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.02em; text-transform:uppercase; }
.bar { display:flex; justify-content:space-between; align-items:center; padding:14px var(--gut); border-bottom:1px solid var(--line); }
.logo { font-weight:900; font-stretch:125%; font-size:22px; letter-spacing:-.02em; }
.bar nav { display:flex; gap:24px; }
.hero { position:relative; min-height:calc(100svh - 50px); display:grid; grid-template-columns:repeat(12,1fr); grid-template-rows:auto 1fr auto; column-gap:var(--gut); padding:0 var(--gut);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px); background-size:calc((100% - 2*var(--gut))/12) 80px; background-position:var(--gut) 0; }
.name { grid-column:1/-1; font-weight:900; font-stretch:62%; font-size:clamp(96px,19vw,300px); line-height:.8; letter-spacing:-.02em; text-transform:uppercase; padding-top:24px; }
.name span { color:var(--hot); }
.stage { grid-column:2/12; grid-row:2; position:relative; display:grid; place-items:center; min-height:420px; }
model-viewer { width:100%; height:100%; min-height:380px; --poster-color:transparent; }
.callout { position:absolute; display:flex; align-items:center; gap:10px; }
.callout::before { content:''; width:var(--w,80px); height:1px; background:var(--ink); transform-origin:left; animation:draw .9s cubic-bezier(.2,.8,.2,1) both; animation-delay:var(--d,.6s); }
.callout.l { flex-direction:row-reverse; } .callout.l::before { transform-origin:right; }
@keyframes draw { from { transform:scaleX(0); } }
.c1 { top:18%; right:-2%; --d:.7s; } .c2 { bottom:22%; left:-4%; --d:.9s; --w:110px; } .c3 { bottom:8%; right:6%; --d:1.1s; }
.specs { grid-column:1/-1; grid-row:3; display:grid; grid-template-columns:repeat(4,1fr) 1.3fr; border-top:1px solid var(--ink); }
.specs > div { padding:14px 0 18px; border-right:1px solid var(--line); padding-left:12px; }
.specs b { display:block; font-weight:700; font-stretch:100%; font-size:22px; margin-top:4px; }
.buy { display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--ink); color:var(--conc); padding:0 20px !important; border:none !important; font-weight:700; font-stretch:115%; text-transform:uppercase; letter-spacing:.02em; }
.buy:hover { background:var(--hot); color:var(--ink); }
.vid { position:absolute; right:var(--gut); top:24px; width:180px; aspect-ratio:1; overflow:hidden; }
.vid video { width:100%; height:100%; object-fit:cover; filter:grayscale(1) contrast(1.1); }
@media (max-width:760px) {
  .bar nav { display:none; }
  .name { font-size:30vw; } .stage { grid-column:1/-1; min-height:300px; } model-viewer { min-height:300px; }
  .vid { display:none; }
  .c2 { left:0; --w:40px; } .c1 { right:0; --w:40px; } .c3 { display:none; }
  .specs { grid-template-columns:1fr 1fr; } .specs > div:nth-child(2) { border-right:none; } .buy { grid-column:1/-1; min-height:56px; }
}
@media (prefers-reduced-motion:reduce) { .callout::before { animation:none; } }
</style>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
</head>
<body>
<header class="bar"><a class="logo" href="#">KRSH</a><nav class="mono"><a href="#">Index</a><a href="#">Lab notes</a><a href="#">Sizing</a></nav><a class="mono" href="#">Bag [0]</a></header>
<main class="hero">
  <h1 class="name">Venom<span>.</span></h1>
  <div class="vid" aria-hidden="true"><video src="../media/hero-alley-web.mp4" autoplay muted loop playsinline></video></div>
  <div class="stage">
    <model-viewer src="../media/sneaker.glb" poster="../images/krsh-venom.webp" alt="KRSH Venom, drag to rotate" camera-controls auto-rotate rotation-per-second="14deg" interaction-prompt="none" camera-orbit="0deg 75deg 78%" field-of-view="26deg" shadow-intensity="1" touch-action="pan-y"></model-viewer>
    <span class="callout c1 mono">Full-grain upper</span>
    <span class="callout l c2 mono">42 mm EVA platform</span>
    <span class="callout c3 mono">Drag to rotate</span>
  </div>
  <div class="specs mono">
    <div>Ref.<b>KR-000</b></div><div>Weight<b>412 g</b></div><div>Run<b>200 pr</b></div><div>Price<b>$310</b></div>
    <a class="buy" href="#">Select size <span>→</span></a>
  </div>
</main>
</body></html>
